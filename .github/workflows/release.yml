name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write   # required to publish the GitHub Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Sync version from tag
        run: python scripts/set_version.py ${{ github.ref_name }}

      - name: Build FastAPI sidecar with PyInstaller
        # Added all the necessary flags from build_app.ps1
        run: >
          pyinstaller api/main.py --onefile --name api_server
          --collect-all ck3gen
          --collect-all utils
          --add-data "config;config"
          --add-data "name_lists;name_lists"
          --add-data "bin/graphviz;bin/graphviz"
          --collect-data fastapi
          --hidden-import uvicorn.logging
          --hidden-import uvicorn.protocols.http.h11_impl
          --hidden-import uvicorn.protocols.http.httptools_impl
          --hidden-import uvicorn.protocols.websockets.auto
          --hidden-import uvicorn.lifespan.on
          --hidden-import uvicorn.lifespan.off

      - name: Copy sidecar to Tauri bin directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ui/src-tauri/bin
          Copy-Item dist/api_server.exe ui/src-tauri/bin/api_server-x86_64-pc-windows-msvc.exe

      - name: Apply release Tauri configuration
        shell: pwsh
        run: |
          Copy-Item ui/src-tauri/tauri_conf.release.json ui/src-tauri/tauri.conf.json -Force

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        working-directory: ui
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri -> target

      - name: Build Tauri app and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ui
          tagName: ${{ github.ref_name }}
          releaseName: "CK3 Character History Generator ${{ github.ref_name }}"
          releaseBody: |
            See the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for installation and usage instructions.
          releaseDraft: false
          prerelease: false